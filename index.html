<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bruno Teixeira | Link Tree</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-color: #0F172A;
        --surface-color: #1E293B;
        --brand-color: #38BDF8;
        --text-white: #FFFFFF;
        --text-dim: rgba(255, 255, 255, 0.6);
        --text-blue: #38BDF8;
        --border-color: rgba(255, 255, 255, 0.1);
        --gradient-primary: linear-gradient(135deg, #3B82F6, #9333EA);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-white);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        overflow-x: hidden;
        border: 8px solid var(--brand-color);
      }

      /* Decoração do Plano de fundo */
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(100px);
        z-index: -1;
        pointer-events: none;
      }
      .blob-1 {
        top: -100px;
        left: -100px;
        width: 400px;
        height: 400px;
        background: rgba(59, 130, 246, 0.2);
      }
      .blob-2 {
        bottom: -100px;
        right: -100px;
        width: 400px;
        height: 400px;
        background: rgba(147, 51, 234, 0.2);
      }

      .container {
        width: 100%;
        max-width: 480px;
        text-align: center;
        animation: fadeInScale 0.6s ease-out;
      }

      @keyframes fadeInScale {
        from { opacity: 0; transform: scale(0.95) translateY(20px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }

      /* Seção do Perfil */
      .header {
        margin-bottom: 40px;
      }

      .avatar-wrapper {
        position: relative;
        width: 128px;
        height: 128px;
        margin: 0 auto 24px;
      }

      .avatar {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 4px solid var(--brand-color);
        background: var(--gradient-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px rgba(56, 189, 248, 0.2);
        overflow: hidden;
      }

      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.7;
      }

      h1 {
        font-size: clamp(32px, 8vw, 48px);
        font-weight: 900;
        letter-spacing: -2px;
        margin-bottom: 8px;
        background: linear-gradient(to right, #FFF, var(--brand-color));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .badge {
        display: inline-block;
        background: rgba(30, 58, 138, 0.4);
        padding: 8px 16px;
        border-radius: 9999px;
        border: 1px solid rgba(56, 189, 248, 0.3);
        font-size: 14px;
        font-weight: 500;
        color: rgba(186, 230, 253, 0.8);
      }

      /* Seção de links */
      .links {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .link-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px;
        background-color: var(--surface-color);
        border: 2px solid var(--border-color);
        border-radius: 16px;
        text-decoration: none;
        color: inherit;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .link-card:hover {
        transform: scale(1.03);
        border-color: var(--brand-color);
      }

      .link-content {
        display: flex;
        align-items: center;
        gap: 16px;
        text-align: left;
      }

      .icon-box {
        width: 44px;
        height: 44px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .icon-linkedin { background-color: #0077B5; }
      .icon-github { background-color: #333; }
      .icon-instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }

      .icon-box svg {
        width: 24px;
        height: 24px;
        fill: white;
      }

      .link-info h2 {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 2px;
      }

      .link-info p {
        font-size: 12px;
        color: rgba(186, 230, 253, 0.3);
        font-weight: 500;
      }

      .arrow {
        color: var(--brand-color);
        font-size: 20px;
        transition: transform 0.3s;
      }

      .link-card:hover .arrow {
        transform: translateX(4px);
      }

      @media (max-width: 480px) {
        body { border-width: 4px; }
        .container { padding: 10px; }
      }
    </style>
  </head>
